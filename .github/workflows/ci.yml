name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test --verbose
      - name: Test (serde-patterns)
        run: cargo test --features serde-patterns --verbose
      - name: Test (testing-extras / proptest)
        run: cargo test --features testing-extras --lib --verbose
      - name: Test (dhat-heap / dhat-rs heap assertions)
        run: cargo test --features dhat-heap --test dhat_heap --verbose
      - name: Test (proc-macro-patterns)
        run: cargo test --features proc-macro-patterns fundamentals::proc_macros --verbose
      - name: Test (proc-macro shim crate, end to end + compile_fail doctests)
        run: cargo test -p rust-interview-practice-macros --verbose
      - name: Build (cli-patterns)
        run: cargo build --features cli-patterns --verbose
      - name: Build (async-parallel)
        run: cargo build --features async-parallel --verbose
      - name: Build (all-features, stable)
        run: cargo build --all-features --verbose

  loom:
    name: loom model checking
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - run: cargo test --release --lib testing_craft::loom_model

  valgrind:
    name: valgrind gates (callgrind, cachegrind, dhat)
    runs-on: ubuntu-latest
    env:
      # Symbols and line numbers for the profiles, optimizations kept.
      CARGO_PROFILE_RELEASE_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: valgrind
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo build --release --bin perf_drills
      # Profiles each good/bad workload pair and fails if a gate doesn't fire.
      - run: target/release/perf_drills valgrind-check

  doc-error-codes:
    name: compile_fail error codes (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-doc
      # rustdoc only verifies the `E0xxx` in `compile_fail,E0xxx` doctests on
      # nightly; on stable any compile error passes. Run the modules whose notes
      # depend on exact error codes.
      # The notes describe the NLL borrow checker that stable ships. Nightly
      # defaults to Polonius (`-Zpolonius=next`), which accepts NLL problem
      # case #3, so pin NLL here. The stable `test` job is the tripwire for
      # Polonius reaching stable.
      - run: cargo test --doc -- compiler_literacy trait_dark_corners
        env:
          RUSTDOCFLAGS: -Zpolonius=no

  fuzz:
    name: fuzz smoke test (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The prebuilt cargo-fuzz is a musl binary and defaults to the musl target,
      # which cannot be sanitized; the steps below pin the gnu target.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: frame_parse (30s)
        run: cargo fuzz run frame_parse --target x86_64-unknown-linux-gnu -- -max_total_time=30
      - name: frame_structured (30s)
        run: cargo fuzz run frame_structured --target x86_64-unknown-linux-gnu -- -max_total_time=30

  verified:
    name: verus proofs (verified/)
    runs-on: ubuntu-24.04
    env:
      # Must match the vstd pin in verified/Cargo.toml (Verus toolchain manifest).
      VERUS_VERSION: 0.2026.09.27.3cf1832
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verified
      - name: Executable tests (ghost code erased, stable Rust)
        run: cargo test --manifest-path verified/Cargo.toml
      - name: Install Verus ${{ env.VERUS_VERSION }}
        run: |
          curl -fsSL -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/verus-x86-linux" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.1 --profile minimal
      - name: Verify proofs
        working-directory: verified
        run: |
          verus --version
          cargo verus verify

  clippy:
    name: clippy (pedantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -W clippy::pedantic -W clippy::nursery -D warnings

  miri:
    name: miri (unsafe_semantics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the latest nightly that ships Miri and makes it the default.
      - uses: dtolnay/rust-toolchain@miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - name: Miri tests (Stacked Borrows)
        run: cargo miri test --lib unsafe_semantics
      - name: Miri tests (Tree Borrows)
        run: cargo miri test --lib unsafe_semantics
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      - name: Counterexample verdicts match the catalog
        run: scripts/miri-counterexamples.sh
