name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test --verbose
      - name: Test (serde-patterns)
        run: cargo test --features serde-patterns --verbose
      - name: Test (testing-extras / proptest)
        run: cargo test --features testing-extras --lib --verbose
      - name: Test (dhat-heap / dhat-rs heap assertions)
        run: cargo test --features dhat-heap --test dhat_heap --verbose
      - name: Build (cli-patterns)
        run: cargo build --features cli-patterns --verbose
      - name: Build (async-parallel)
        run: cargo build --features async-parallel --verbose
      - name: Build (all-features, stable)
        run: cargo build --all-features --verbose

  loom:
    name: loom model checking
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - run: cargo test --release --lib testing_craft::loom_model

  valgrind:
    name: valgrind gates (callgrind, cachegrind, dhat)
    runs-on: ubuntu-latest
    env:
      # Symbols and line numbers for the profiles, optimizations kept.
      CARGO_PROFILE_RELEASE_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: valgrind
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo build --release --bin perf_drills
      # Profiles each good/bad workload pair and fails if a gate doesn't fire.
      - run: target/release/perf_drills valgrind-check

  fuzz:
    name: fuzz smoke test (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The prebuilt cargo-fuzz is a musl binary and defaults to the musl target,
      # which cannot be sanitized; the steps below pin the gnu target.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: frame_parse (30s)
        run: cargo fuzz run frame_parse --target x86_64-unknown-linux-gnu -- -max_total_time=30
      - name: frame_structured (30s)
        run: cargo fuzz run frame_structured --target x86_64-unknown-linux-gnu -- -max_total_time=30

  clippy:
    name: clippy (pedantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -W clippy::pedantic -W clippy::nursery -D warnings
