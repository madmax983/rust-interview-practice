[package]
name = "rust-interview-practice"
version = "0.1.0"
edition = "2024"

# The root package is also a workspace so the `macros/` proc-macro shim crate builds
# and tests alongside it. `cargo test` at the root still only tests this package;
# use `-p rust-interview-practice-macros` (or `--workspace`) for the shim's tests.
# `fuzz/` (cargo-fuzz, nightly) and `verified/` (Verus) declare their own workspaces.
[workspace]
members = [".", "macros"]
exclude = ["fuzz", "verified"]

[dependencies]
# Optional: Enable with --features async-parallel
tokio = { version = "1.42", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
rayon = { version = "1.10", optional = true }

# Optional: Enable with --features testing-extras
proptest = { version = "1.5", optional = true }

# Optional: Enable with --features serde-patterns
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
bincode = { version = "1.3", optional = true }

# Optional: Enable with --features cli-patterns
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
crc32fast = "1.5.0"

# Optional: Enable with --features proc-macro-patterns
proc-macro2 = { version = "1.0", optional = true }
quote = { version = "1.0", optional = true }
syn = { version = "2.0", features = ["full", "visit-mut", "extra-traits"], optional = true }

# Loom model checker for `testing_craft::loom_model`. Gated on the `loom` cfg
# (NOT a Cargo feature) so `--all-features` never swaps std sync primitives for
# loom's. Run: RUSTFLAGS="--cfg loom" cargo test --release --lib testing_craft::loom_model
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[features]
# Feature flag for async/parallel fundamentals
async-parallel = ["tokio", "tokio-stream", "futures", "rayon"]

# Feature flag for advanced testing patterns
testing-extras = ["proptest"]

# Feature flag for serde serialization patterns
serde-patterns = ["serde", "serde_json", "serde_yaml", "toml", "bincode"]

# Feature flag for CLI/TUI patterns with ratatui
cli-patterns = ["ratatui", "crossterm", "clap"]

# Feature flag for procedural-macro patterns (syn/quote/proc-macro2).
# The real `#[derive]`/`#[attr]`/`fn!()` shims live in the `macros/` workspace crate.
proc-macro-patterns = ["proc-macro2", "quote", "syn"]

# Retained for backwards compatibility. The portable-SIMD (`std::simd`) code is
# NOT gated on this Cargo feature, because `cargo build --all-features` would then
# try to compile nightly-only code on stable and fail (E0658). Instead the portable
# SIMD module is gated on the `nightly_portable_simd` cfg flag (see [lints.rust]
# below), which `--all-features` cannot enable. Enabling this feature is a no-op.
simd-patterns = []

# The portable-SIMD examples in `src/fundamentals/simd.rs` require nightly Rust
# (`std::simd` / `#![feature(portable_simd)]`). They are gated on the
# `nightly_portable_simd` cfg — NOT a Cargo feature — so that `--all-features`
# builds cleanly on stable. Declaring the cfg here keeps the `unexpected_cfgs`
# lint quiet. To build the nightly path:
#   1. Add `#![cfg_attr(nightly_portable_simd, feature(portable_simd))]` to the crate root.
#   2. Compile on nightly: `RUSTFLAGS="--cfg nightly_portable_simd" cargo +nightly build`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly_portable_simd)', 'cfg(loom)'] }
